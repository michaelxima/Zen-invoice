name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Build & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: invoice_claw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invoice_claw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/invoice_claw
      POSTGRES_POOL_MAX: 2
      NEXTAUTH_URL: http://localhost:3005
      NEXTAUTH_SECRET: test_secret_key_for_ci_environments_123456
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run currency and validation unit checks
        run: npm run test:unit

      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate

      - name: Build production application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test
